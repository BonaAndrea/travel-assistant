name: Rigenera catalogo demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Scrivi RIGENERA-CATALOGO per confermare la cancellazione dei dati demo"
        required: true
        type: string

permissions:
  contents: read

jobs:
  seed:
    if: ${{ !cancelled() && inputs.confirmation == 'RIGENERA-CATALOGO' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verifica configurazione database
        run: test -n "$DATABASE_URL"
      - name: Applica migrazioni
        run: npm run prisma:migrate:deploy
      - name: Rigenera catalogo e indice RAG
        run: npm run seed
