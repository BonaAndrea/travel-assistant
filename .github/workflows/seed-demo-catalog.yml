name: Rigenera catalogo demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Scrivi RIGENERA-CATALOGO per confermare la cancellazione dei dati demo"
        required: true
        type: string

permissions:
  contents: read

jobs:
  seed:
    if: ${{ !cancelled() && inputs.confirmation == 'RIGENERA-CATALOGO' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements.txt
      - run: python -m pip install -r backend-python/requirements.txt
      - name: Verifica configurazione database
        run: test -n "$DATABASE_URL"
      - name: Applica migrazioni Python
        run: PYTHONPATH=backend-python python -c "from app.migrations import apply_migrations; apply_migrations()"
      - name: Rigenera catalogo e indice RAG Python
        run: PYTHONPATH=backend-python python backend-python/scripts/seed.py
