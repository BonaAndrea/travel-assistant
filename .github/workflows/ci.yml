name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-python/requirements.txt
      - run: python -m pip install -r backend-python/requirements.txt
      - run: python -m pytest backend-python/tests -q
      - run: python -m compileall -q backend-python/app backend-python/scripts
      - run: docker compose config --quiet
      - run: docker compose build backend-python frontend-python
