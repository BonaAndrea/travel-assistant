services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel_test
      POSTGRES_PASSWORD: travel_test
      POSTGRES_DB: travel_assistant_test
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travel_test -d travel_assistant_test']
      interval: 1s
      timeout: 3s
      retries: 30
