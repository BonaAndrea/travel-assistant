services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_assistant
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travel -d travel_assistant']
      interval: 5s
      timeout: 5s
      retries: 5

  backend-python:
    build:
      context: .
      dockerfile: backend-python/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://travel:travel@postgres:5432/travel_assistant?schema=public
      ENVIRONMENT: development
      JWT_SECRET: development-only-change-me
      PREFERENCE_IMAGE_DIR: /app/uploads/preferences
    ports:
      - '4001:4001'
    volumes:
      - preference_uploads_python:/app/uploads/preferences

  frontend-python:
    build:
      context: ./frontend
      dockerfile: Dockerfile.python
    depends_on:
      - backend-python
    ports:
      - '8081:80'

volumes:
  pgdata:
  preference_uploads_python:
