services:
  - type: web
    name: travel-assistant-backend-python
    runtime: docker
    rootDir: .
    dockerfilePath: ./backend-python/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: travel-assistant-frontend
    runtime: static
    rootDir: frontend
    buildCommand: >-
      test -n "$API_BASE_URL" &&
      find . -type f \( -name '*.js' -o -name '*.html' \) -print0 |
      xargs -0 -r sed -i "s|http://localhost:4001/api|$API_BASE_URL|g"
    staticPublishPath: .
    envVars:
      - key: API_BASE_URL
        sync: false
