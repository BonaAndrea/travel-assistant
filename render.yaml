services:
  - type: web
    name: travel-assistant-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: travel-assistant-frontend
    runtime: static
    rootDir: frontend
    buildCommand: >-
      test -n "$API_BASE_URL" &&
      find . -type f -name '*.js' -print0 |
      xargs -0 -r sed -i "s|http://localhost:4000/api|$API_BASE_URL|g"
    staticPublishPath: .
    plan: free
    envVars:
      - key: API_BASE_URL
        sync: false
